name: Worker supervisor split verification

on:
  push:
    branches:
      - refactor/worker-supervisor-decomposition

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Checkout VST3 SDK
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
      - name: Configure
        run: cmake -S native -B native/build/worker-split-ci -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DDAW_BUILD_PLUGIN_HOST=ON -DDAW_BUILD_AUDIO_HOST_MACOS=ON -DVST3_SDK_PATH="$RUNNER_TEMP/vst3sdk"
      - name: Build worker and audio host tests
        run: cmake --build native/build/worker-split-ci --target daw-plugin-host-worker-test daw-audio-host-macos daw-audio-host-macos-test daw-audio-host-macos-graph-integration-test daw-audio-host-macos-transaction-test -j 3
      - name: Run native CTest
        run: ctest --test-dir native/build/worker-split-ci --output-on-failure -R 'daw-plugin-host-worker-test|daw-audio-host-macos|daw-realtime-callback-static-guard'
