name: Production DSP Wave A validation

on:
  push:
    branches:
      - production-dsp-platform

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - run: bun install --frozen-lockfile
      - name: Install browser harness
        run: |
          bun add --global agent-browser@0.38.2
          agent-browser install
      - run: bun run build:portable-wasm
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:anti-slop
      - name: Build production app
        env:
          VITE_CONVEX_URL: https://placeholder-verify.convex.cloud
        run: bun run build
      - name: Characterize production build in Chromium
        env:
          VITE_CONVEX_URL: https://placeholder-verify.convex.cloud
        run: |
          bun -e '
            const root = "dist/client";
            Bun.serve({
              hostname: "127.0.0.1",
              port: 4173,
              async fetch(request) {
                const url = new URL(request.url);
                const relativePath = decodeURIComponent(url.pathname).split("/").filter(Boolean).join("/") || "index.html";
                const candidate = Bun.file(root + "/" + relativePath);
                if (await candidate.exists()) return new Response(candidate);
                return new Response(Bun.file(root + "/index.html"), {
                  headers: { "content-type": "text/html; charset=utf-8" },
                });
              },
            });
          ' > "$RUNNER_TEMP/dsp-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; agent-browser --session dsp-wave-a close >/dev/null 2>&1 || true' EXIT
          READY=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            cat "$RUNNER_TEMP/dsp-preview.log"
            exit 1
          fi
          agent-browser --session dsp-wave-a open 'http://127.0.0.1:4173/dsp-characterization?diagnostic=dsp&autorun=1'
          for attempt in {1..90}; do
            agent-browser --session dsp-wave-a eval 'document.querySelector("#dsp-characterization-result")?.dataset.status ?? ""' > "$RUNNER_TEMP/dsp-status.json"
            STATUS=$(bun -e 'console.log(JSON.parse(await Bun.file(process.env.RUNNER_TEMP + "/dsp-status.json").text()))')
            [ "$STATUS" = "complete" ] && break
            sleep 1
          done
          agent-browser --session dsp-wave-a eval 'document.querySelector("#dsp-characterization-result")?.textContent ?? ""' > "$RUNNER_TEMP/dsp-report-eval.json"
          bun -e '
            const encoded = JSON.parse(await Bun.file(process.env.RUNNER_TEMP + "/dsp-report-eval.json").text());
            if (!encoded) throw new Error("DSP characterization did not complete.");
            const report = JSON.parse(encoded);
            const required = ["audioWorklet","offlineAudioWorklet","transferableBuffers","sharedArrayBuffer","crossOriginIsolated","outputSelection","sinkRouting","mediaTrackSettings"];
            for (const key of required) {
              if (typeof report.platform?.capabilities?.[key] !== "boolean") throw new Error("Missing capability " + key);
              if (typeof report.platform?.evidence?.[key]?.supported !== "boolean") throw new Error("Missing capability evidence " + key);
            }
            if (report.platform.policy.productionTarget !== "chrome-stable") throw new Error("Unexpected production browser policy.");
            if (report.platform.capabilities.audioWorklet !== true) throw new Error("Live AudioWorklet probe failed in Chromium.");
            if (report.platform.capabilities.offlineAudioWorklet !== true) throw new Error("Offline AudioWorklet probe failed in Chromium.");
            if (report.platform.capabilities.transferableBuffers !== true) throw new Error("Transferable ArrayBuffer probe failed in Chromium.");
            console.log(JSON.stringify({ policy: report.platform.policy, capabilities: report.platform.capabilities, evidence: report.platform.evidence }, null, 2));
          '
      - name: Build native audio-core fixture runner
        run: sh native/audio-core/scripts/build-native.sh
      - name: Focused characterization contracts
        env:
          VITE_CONVEX_URL: https://placeholder-verify.convex.cloud
        run: bun test packages/audio-engine/src/browser-characterization.test.ts packages/audio-engine/src/worklet-loader.test.ts
      - name: Configured full Bun suite
        env:
          VITE_CONVEX_URL: https://placeholder-verify.convex.cloud
          TMPDIR: ${{ runner.temp }}/daw-bun-suite
        run: |
          mkdir -p "$TMPDIR"
          bun test --timeout 15000 --max-concurrency 1
      - name: Compare Knip against exact master
        run: |
          bun x knip --reporter json > "$RUNNER_TEMP/knip-branch.json" || true
          git worktree add "$RUNNER_TEMP/knip-base" 7a8e9a0c8c71977691a1eeb97a4484c2319b5ad2
          (
            cd "$RUNNER_TEMP/knip-base"
            bun install --frozen-lockfile
            bun x knip --reporter json > "$RUNNER_TEMP/knip-base.json" || true
          )
          bun -e '
            const fs = require("node:fs");
            const normalize = (path) => {
              const report = JSON.parse(fs.readFileSync(path, "utf8"));
              const findings = new Set();
              for (const issue of report.issues ?? []) {
                for (const [kind, values] of Object.entries(issue)) {
                  if (kind === "file" || kind === "owners" || !Array.isArray(values)) continue;
                  for (const value of values) {
                    const name = value && typeof value === "object"
                      ? [value.namespace ?? "", value.name ?? JSON.stringify(value)].join(":")
                      : JSON.stringify(value);
                    findings.add([issue.file, kind, name].join("\t"));
                  }
                }
              }
              return findings;
            };
            const base = normalize(process.env.RUNNER_TEMP + "/knip-base.json");
            const branch = normalize(process.env.RUNNER_TEMP + "/knip-branch.json");
            const added = [...branch].filter((finding) => !base.has(finding)).sort();
            const removed = [...base].filter((finding) => !branch.has(finding)).sort();
            console.log(JSON.stringify({ base: base.size, branch: branch.size, added, removed }, null, 2));
            if (added.length !== 0) process.exit(1);
          '
