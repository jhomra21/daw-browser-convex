name: DSP characterization validation

on:
  push:
    branches:
      - production-dsp-characterization

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Focused characterization tests
        run: bun test packages/audio-engine/src/dsp-characterization.test.ts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Install browser harness
        run: |
          bun add --global agent-browser@0.38.2
          agent-browser install
      - name: Validate production browser characterization
        env:
          VITE_CONVEX_URL: https://placeholder-verify.convex.cloud
        run: |
          bun -e '
            const root = "dist/client";
            const server = Bun.serve({
              hostname: "127.0.0.1",
              port: 4173,
              async fetch(request) {
                const url = new URL(request.url);
                const pathname = decodeURIComponent(url.pathname);
                const file = Bun.file(root + pathname);
                if (pathname !== "/" && await file.exists()) return new Response(file);
                return new Response(Bun.file(root + "/index.html"), {
                  headers: { "content-type": "text/html; charset=utf-8" },
                });
              },
            });
            console.log(server.url.toString());
            await new Promise(() => {});
          ' > "$RUNNER_TEMP/dsp-preview.log" 2>&1 &
          preview_pid=$!
          trap 'agent-browser --session dsp-characterization close >/dev/null 2>&1 || true; kill "$preview_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/dsp-characterization?diagnostic=dsp >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { cat "$RUNNER_TEMP/dsp-preview.log"; exit 1; }
          agent-browser --session dsp-characterization open 'http://127.0.0.1:4173/dsp-characterization?diagnostic=dsp&autorun=1'
          complete=0
          for attempt in $(seq 1 90); do
            state=$(agent-browser --session dsp-characterization eval 'document.querySelector("#dsp-characterization-result")?.dataset.status ?? "pending"')
            if echo "$state" | grep -q complete; then
              complete=1
              break
            fi
            alert=$(agent-browser --session dsp-characterization eval 'document.querySelector("[role=alert]")?.textContent ?? ""')
            if ! echo "$alert" | grep -q '^""; then
              echo "Browser characterization failed: $alert"
              exit 1
            fi
            sleep 1
          done
          test "$complete" -eq 1 || { echo "Browser characterization did not complete."; exit 1; }
          agent-browser --session dsp-characterization eval 'JSON.stringify(JSON.parse(document.querySelector("#dsp-characterization-result").textContent))' > "$RUNNER_TEMP/dsp-characterization.txt"
          RUNNER_TEMP="$RUNNER_TEMP" bun -e '
            const fs = require("node:fs");
            const encoded = fs.readFileSync(process.env.RUNNER_TEMP + "/dsp-characterization.txt", "utf8").trim();
            const report = JSON.parse(JSON.parse(encoded));
            const eq = report.eq;
            const stereo = report.stereoIsolation;
            console.log(JSON.stringify({ eq, stereoIsolation: stereo }, null, 2));
            if (eq?.status !== "pass") throw new Error("EQ browser characterization did not pass.");
            if (!(eq.metrics?.gainDb > 5.5 && eq.metrics?.gainDb < 6.5)) throw new Error("EQ gain response is outside the +6 dB gate.");
            if (!(eq.metrics?.thdPlusNoiseDb < -60)) throw new Error("EQ THD+N is outside the release gate.");
            if (stereo?.status !== "pass") throw new Error("Stereo isolation browser characterization did not pass.");
            if (!(stereo.metrics?.crosstalkDb <= -120)) throw new Error("Stereo crosstalk is outside the release gate.");
          '
