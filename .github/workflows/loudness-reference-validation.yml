name: Loudness reference validation

on:
  push:
    branches:
      - feat/loudness-reference-validation

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run libebur128 reference validation
        run: bun run verify:loudness-reference
      - name: Typecheck
        if: runner.os == 'Linux'
        run: bun run typecheck
      - name: Lint
        if: runner.os == 'Linux'
        run: bun run lint
