name: Production DSP Wave A validation

on:
  push:
    branches:
      - production-dsp-platform

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:portable-wasm
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:anti-slop
      - run: bun run build
      - name: Build native audio-core fixture runner
        run: sh native/audio-core/scripts/build-native.sh
      - name: Focused characterization contracts
        env:
          VITE_CONVEX_URL: https://placeholder-verify.convex.cloud
        run: bun test packages/audio-engine/src/browser-characterization.test.ts packages/audio-engine/src/worklet-loader.test.ts
      - name: Configured full Bun suite
        env:
          VITE_CONVEX_URL: https://placeholder-verify.convex.cloud
          TMPDIR: ${{ runner.temp }}/daw-bun-suite
        run: |
          mkdir -p "$TMPDIR"
          bun test --timeout 15000 --max-concurrency 1
      - name: Compare Knip against exact master
        run: |
          bun x knip --reporter json > "$RUNNER_TEMP/knip-branch.json" || true
          git worktree add "$RUNNER_TEMP/knip-base" 7a8e9a0c8c71977691a1eeb97a4484c2319b5ad2
          (
            cd "$RUNNER_TEMP/knip-base"
            bun install --frozen-lockfile
            bun x knip --reporter json > "$RUNNER_TEMP/knip-base.json" || true
          )
          bun -e '
            const fs = require("node:fs");
            const normalize = (path) => {
              const report = JSON.parse(fs.readFileSync(path, "utf8"));
              const findings = new Set();
              for (const issue of report.issues ?? []) {
                for (const [kind, values] of Object.entries(issue)) {
                  if (kind === "file" || kind === "owners" || !Array.isArray(values)) continue;
                  for (const value of values) {
                    const name = value && typeof value === "object"
                      ? [value.namespace ?? "", value.name ?? JSON.stringify(value)].join(":")
                      : JSON.stringify(value);
                    findings.add([issue.file, kind, name].join("\t"));
                  }
                }
              }
              return findings;
            };
            const base = normalize(process.env.RUNNER_TEMP + "/knip-base.json");
            const branch = normalize(process.env.RUNNER_TEMP + "/knip-branch.json");
            const added = [...branch].filter((finding) => !base.has(finding)).sort();
            const removed = [...base].filter((finding) => !branch.has(finding)).sort();
            console.log(JSON.stringify({ base: base.size, branch: branch.size, added, removed }, null, 2));
            if (added.length !== 0) process.exit(1);
          '
