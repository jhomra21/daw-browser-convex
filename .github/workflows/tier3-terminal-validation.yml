name: Tier 3 terminal diagnostics validation

on:
  push:
    branches:
      - fix/tier3-terminal-recording-diagnostics

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - run: bun install --frozen-lockfile
      - name: Install browser harness
        run: |
          bun add --global agent-browser@0.38.2
          agent-browser install
      - name: Build portable Wasm
        run: bun run build:portable-wasm
      - name: Build native audio-core fixture runner
        run: sh native/audio-core/scripts/build-native.sh
      - name: Focused Tier 3 tests
        run: bun test tools/performance/30-track/tier-three.test.ts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:anti-slop
      - run: bun run build
      - name: Full configured Bun suite
        env:
          VITE_CONVEX_URL: https://polite-peccary-245.convex.cloud
          TMPDIR: ${{ runner.temp }}/daw-tier3-terminal-suite
        run: |
          mkdir -p "$TMPDIR"
          bun test --timeout 15000 --max-concurrency 1
